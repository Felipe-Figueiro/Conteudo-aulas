<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>viacep</title>
    <style>
        /**{
            padding: 0;
            margin: 0;
        } */
        body {
            font-family: Arial, Helvetica, sans-serif;
            justify-content: center;
            display: flex;
            align-items: center;
            height: 100vh;
        }

        .container {
            max-width: 40vh;
            box-shadow: 0 0 10px black;
            padding: 2vh 4vh;
            border-radius: 10px;
        }

        input {
            border-radius: 4px;
            border-color: rgb(173, 173, 173);
            border: 1px solid;
            transition: border 0.2s;
        }

        input:focus {
            background-color: #e7e7e7;
            border: 2px solid #161892;
            outline: none;

        }

        label {
            font-weight: bold;
            color: black;
            display: block;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>
    <div>
        <div class="container">
            <h2>Consulta de cep</h2>
            <label for="cep">CEP</label>
            <input type="text" maxlength="9" id="cep" placeholder="Digite seu CEP">
            
            <label for="estado">Estado:</label> 
            <input type="text" id="estado" readonly>
            
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" readonly>
            
            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" readonly>
            
            <label for="logradouro">Logradouro:</label>
            <input type="text" id="logradouro">
            
            <label for="numero">Numero:</label>
            <input type="text" id="numero">
            
            <p class="error" id="error"></p>
        </div>
        <script>
            const cepInput = document.getElementById("cep");
            const estado = document.getElementById("estado");
            const cidade = document.getElementById("cidade");
            const bairro = document.getElementById("bairro");
            const logradouro = document.getElementById("logradouro");
            const error = document.getElementById("error");

            cepInput.addEventListener("blur", async () => {
                /*Filtra o texto para apenas números*/
                const cep = cepInput.value.replace(/\D/g, "");
                /* Verifica se o texto tem 8 caracteres numerais */
                if (cep.length !== 8) {
                    error.textContent = "Cep Inválido!";
                    return;
                }
                error.textContent = "buscando dados";
                /*Quando a requisição acontece*/
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();

                    if (data.erro) {
                        /*Caso os dados estejam errados, mostra mensagem e limpa os dados*/
                        error.textContent = "cep não encontrado";
                        estado.value = cidade.value = bairro.value = logradouro.value = "";
                    }
                    else {
                        /*se os dados estão corretos, limpa o campo de erro e salva os dados*/
                        error.textContent = "";
                        // CORRIGIDO: O ViaCEP retorna 'uf' para estado
                        estado.value = data.uf; 
                        // CORRIGIDO: O ViaCEP retorna 'localidade' para cidade
                        cidade.value = data.localidade; 
                        bairro.value = data.bairro;
                        logradouro.value = data.logradouro;
                    }
                }
                /**************Quando a requisição falhar executa aqui***************************/
                catch (err) {
                    error.textContent = "erro ao buscar o cep"
                    console.error(err);
                }
            });
        </script>
    </div>
</body>

</html>
