<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOMMERCE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />


</head>

<body>

    <header class="header">
        <span class="material-symbols-outlined">home</span>
        <span class="material-symbols-outlined">search</span>
        <span class="material-symbols-outlined">favorite</span>
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">shopping_basket</span>
    </header>
    <div>
        <main id="produto-card"></main>
    </div>
    <div id="modal" class="modal">
        <div class="contmodal">
            <p class="titmodal">Finalize sua compra!</p>
            <img class="qrcode" src="assets/QRCODE.png" alt="qrcode">
            <button id="btn-fechar" class="btn-comprar">Fechar</button>

        </div>
    </div>
    <footer class="footer">Todos direitos reservados</footer>
    <script src="script.js"></script>
</body>

</html>
